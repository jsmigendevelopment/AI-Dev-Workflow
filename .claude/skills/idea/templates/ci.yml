# Copy to .github/workflows/ci.yml. Runs on every pull request and on main.
# Uses the check contract in AGENTS.md, so it works for any stack that provides
# these scripts. A stack pack may ship its own filled-in version.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint        # includes the boundary check
      - run: npm run typecheck
      - run: npm test            # unit tests, every slice's
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e    # the `auto` acceptance checks

  research:
    # The research folder: index, provenance, claim labels, re-check dates, append-only stores.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check docs/research
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -d docs/research ]; then echo "No docs/research yet."; exit 0; fi
          node .agents/skills/research/scripts/check-research.mjs docs/research ${BASE:+--base "$BASE"}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --no-git --source /repo --redact

  agent-files:
    # A pull request that changes the agents' own rules needs the person: they add the
    # `human-approved` label after reading the diff. On Full automation (docs/stack.md on the
    # base branch), a "Weakening review: pass @ <head sha>" comment passes it instead (#103).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Agent rule files need a human, or on Full the weakening review
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The guard runs from the base commit, so a pull request can't change it for itself.
          guard=.agents/skills/coordinate/scripts/agent-files.mjs
          if git cat-file -e "$BASE:$guard" 2>/dev/null; then
            git show "$BASE:$guard" > "$RUNNER_TEMP/agent-files.mjs"
            node "$RUNNER_TEMP/agent-files.mjs"
          else
            changed=$(git diff --name-only "$BASE"...HEAD | grep -E '^(AGENTS\.md|CLAUDE\.md|\.agents/|\.claude/|\.codex/|\.github/)' || true)
            if [ -n "$changed" ] && ! echo ",$LABELS," | grep -q ",human-approved,"; then
              echo "These files change the agents' rules and need the human-approved label:"
              echo "$changed"
              exit 1
            fi
          fi
