# Git hooks. `pnpm install` installs them when the folder is already a git repository (lefthook's install script).
# Run `pnpm hooks` once after `git init`, or in a git worktree.
# pre-commit formats and lints the staged files only, and re-stages what it fixed.
# The merge gate runs the full `pnpm check` anyway, so `git commit --no-verify` never ships unlinted code.
pre-commit:
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,cjs,mjs,json,jsonc,css,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    # The Worker's types first: worker-configuration.d.ts is git-ignored, and without it the typed rules misread
    # the code (a fix can drop a type assertion that is needed). The same order as `pnpm lint`.
    - name: lint
      glob: '*.{ts,tsx,js,cjs,mjs}'
      run: pnpm cf-typegen && pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
