# Turns on auto-merge for Dependabot's patch and minor updates to development dependencies.
# GitHub then merges each one only after every required check passes; anything else
# (production dependencies, major versions, GitHub Actions) waits for a person.
#
# Needs, once, in the repo settings: General → "Allow auto-merge", and a branch protection rule
# (or ruleset) on main that requires the CI checks. Without required checks, auto-merge would
# merge at once. A merge made with this token doesn't start other workflows (GitHub's rule for
# GITHUB_TOKEN), so the test deploy runs on the next push to main.
name: dependabot-auto-merge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository_owner == github.event.pull_request.head.repo.owner.login
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for dev patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem == 'npm_and_yarn' &&
          steps.meta.outputs.dependency-type == 'direct:development' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
