# Deploys main to production. Started by hand (Actions → deploy-production → Run workflow), and
# the GitHub environment `production` waits for the person's approval before any step runs.
# Order: build, take a D1 Time Travel bookmark (the backup), migrate, deploy, smoke. A failed smoke
# puts the previous version back and prints the command that would restore the data. Restoring
# data is never automatic: it is the person's call.
# Until the person says go live, env.production.vars.LAUNCHED in wrangler.jsonc is "false": the
# smoke test then checks the "Coming soon" page; once it is "true", the real app.
name: deploy-production
on:
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and with Access in front of production
    # (setup-cloudflare --protect-production) CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET.
    # Variables: SITE_URL (the production origin, baked into the build), APP_URL (optional: where
    # to smoke-test when workers.dev is off; never the custom domain with Bot Fight Mode on, whose challenge a browser test can fail).
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    env:
      CLOUDFLARE_ENV: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Back up first (D1 Time Travel bookmark)
        id: bookmark
        run: |
          pnpm exec wrangler d1 time-travel info DB -c wrangler.jsonc --json > bookmark.json
          # The JSON object only: wrangler may print a banner line before it.
          bookmark=$(sed -n '/^{/,/^}/p' bookmark.json | jq -r '.bookmark // empty')
          if [ -z "$bookmark" ]; then echo "No bookmark: refusing to migrate without a restore point."; exit 1; fi
          echo "bookmark=$bookmark" >> "$GITHUB_OUTPUT"
          {
            echo "### Restore point"
            echo "D1 bookmark taken before migrating: \`$bookmark\`"
            echo "Restore (destructive, the person decides): \`pnpm exec wrangler d1 time-travel restore DB --bookmark=$bookmark --env production -c wrangler.jsonc\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply D1 migrations to production
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.jsonc
      - name: Deploy
        id: deploy
        env:
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --message "production ${SHA::7}" | tee deploy.log
      - name: Find the URL
        id: url
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # workers.dev first: it is outside the zone, so Bot Fight Mode never challenges the smoke test.
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)"
          url="${url:-$APP_URL}"
          if [ -z "$url" ]; then echo "No workers.dev URL in the deploy output. Set the APP_URL variable."; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Launched or Coming soon?
        id: launch
        run: |
          launched=$(node -e "import('./scripts/cloudflare/setup.ts').then(({ readResources }) => console.log(readResources(require('node:fs').readFileSync('wrangler.jsonc', 'utf8')).production.vars.LAUNCHED === 'true'))")
          echo "launched=$launched" >> "$GITHUB_OUTPUT"
          if [ "$launched" = true ]; then
            echo "Production is launched: smoke-testing the app." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production is not launched: every visitor sees the Coming soon page. Going live is the person's call (LAUNCHED in wrangler.jsonc)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke and a11y against production
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          LAUNCHED: ${{ steps.launch.outputs.launched }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ "$LAUNCHED" = true ]; then pnpm test:deployed; else pnpm test:coming-soon; fi
      - name: Roll back to the previous version
        if: failure() && steps.deploy.outcome == 'success'
        env:
          SHA: ${{ github.sha }}
        run: pnpm exec wrangler rollback --yes --message "smoke failed on ${SHA::7}"
      - name: How to restore the data
        if: failure() && steps.bookmark.outputs.bookmark != ''
        env:
          BOOKMARK: ${{ steps.bookmark.outputs.bookmark }}
        run: |
          echo "::warning::Production deploy failed. The code was rolled back if it had deployed; the data was not touched."
          echo "If a migration damaged data, the person can restore the database to before this run:"
          echo "  pnpm exec wrangler d1 time-travel restore DB --bookmark=${BOOKMARK} --env production -c wrangler.jsonc"
          echo "This overwrites every write made since. Ask the person first."
