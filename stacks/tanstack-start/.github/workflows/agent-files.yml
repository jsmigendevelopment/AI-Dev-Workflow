name: agent-files
# The agent-file guard: a pull request that changes the agents' rules, check code or the automation
# level (AGENTS.md, AGENTS.override.md, CLAUDE.md, CLAUDE.local.md, GEMINI.md at any depth, .agents/,
# .claude/, .codex/, .github/, docs/stack.md, in any case) needs the `human-approved` label. On Full
# automation (docs/stack.md on the default branch) the label doesn't count: only a
# "Weakening review: pass @ <head sha>" comment from someone with write access does. On every level, a
# writer's fail comment at the head refuses (#103).
#
# Why this is safe, and why it's its own file:
# - pull_request_target runs this file as it is on the default branch, never the pull request's copy. So a pull request can't edit the guard, its script or the level it reads.
# - It checks out the default branch only, and runs only that branch's guard script. No code from the
#   pull request is checked out or run. Its files, labels and comments are read as data through the API.
# - The token is read-only (the permissions below), and the checkout keeps no credentials.
# - It checks the head the event names (HEAD_SHA) and fails if the pull request moved during the run.
# A comment doesn't start a run. After a pass or a fail comment, the reviewer removes and re-adds the
# no-op `weakening-reviewed` label, which starts a fresh run on the head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  agent-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Agent rule files need a human, or on Full the weakening review
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          guard=.agents/skills/coordinate/scripts/agent-files.mjs
          if [ -f "$guard" ]; then
            node "$guard" --pr "$PR"
            exit $?
          fi
          # No guard script on the default branch yet: the label rule only. Renames count both names.
          total=$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files')
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | wc -l)
          if [ "$total" -gt 3000 ] || [ "$total" -gt "$listed" ]; then
            echo "The pull request changes $total files and the API listed $listed. Split it."
            exit 1
          fi
          changed=$(printf '%s\n' "$files" | grep -iE '^(\.agents|\.claude|\.codex|\.github)(/|$)|^docs/stack\.md$|(^|/)(AGENTS(\.override)?|CLAUDE(\.local)?|GEMINI)\.md$' || true)
          labels=$(gh api --paginate "repos/$REPO/issues/$PR/labels" --jq '.[].name')
          if [ -n "$changed" ] && ! printf '%s\n' "$labels" | grep -qx 'human-approved'; then
            echo "Files that change the agents' rules need the human-approved label."
            printf '%s\n' "$changed" | tr -cd '[:print:]\n' | sed 's/^/  /'
            exit 1
          fi
