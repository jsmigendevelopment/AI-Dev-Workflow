# Runs on every pull request and on main. Uses the check contract in package.json.
name: ci
on:
  pull_request:
  push:
    branches: [main]
# A new push to the same branch or pull request cancels the run it makes stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Read-only token by default; no job here needs to write.
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the version from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint # type-aware ESLint (code style, module boundaries), then Prettier
      - run: pnpm typecheck
      - run: pnpm knip # unused files, exports and dependencies
      - run: pnpm dupes # duplicated code (jscpd; tests ignored)
      - run: pnpm check:migrations # no dropped or renamed columns, NOT NULL without a default, float money
      - run: pnpm test # service, controller and repository tests (local D1)
      - name: Migrations match the tables
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "A table changed without a migration. Run pnpm db:generate and commit the result."
            git status --porcelain migrations
            exit 1
          fi
      - run: pnpm build
      - run: pnpm check:budgets # initial JS, route JS, CSS and lazy-chunk budgets (gzip)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e # smoke, security headers and limits, SEO, axe on every route

  visual:
    # Screenshot tests: every page in both themes, desktop and phone, against the committed baselines
    # in e2e/visual.spec.ts-snapshots/. Runs in Playwright's own image, so fonts and rendering match
    # the place the baselines were made. A diff fails; the report shows expected, actual and diff.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

  semgrep:
    # Semgrep's free community rules for TypeScript and React (no account, no token, no upload).
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.185.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep community rules
        run: semgrep scan --config p/typescript --config p/react --error --metrics=off --exclude e2e

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No high or critical advisories
        run: pnpm audit --audit-level=high
      - name: Licences on the allow-list
        run: pnpm check:licenses

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --no-git --source /repo --redact

  agent-files:
    # A pull request that changes the agents' own rules needs the person.
    # They add the `human-approved` label after reading the diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Agent rule files need a human
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD | grep -E '^(AGENTS\.md|CLAUDE\.md|\.agents/|\.claude/|\.github/)' || true)
          if [ -n "$changed" ] && ! echo ",$LABELS," | grep -q ",human-approved,"; then
            echo "These files change the agents' rules and need the human-approved label:"
            echo "$changed"
            exit 1
          fi
