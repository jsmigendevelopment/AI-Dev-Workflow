<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>onRails</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#17133a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <!-- laser lines -->
  <g stroke-linecap="round" opacity="0.55">
    <line x1="1280" y1="40" x2="820" y2="360" stroke="#60a5fa" stroke-width="2"/>
    <line x1="1280" y1="90" x2="900" y2="360" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="1280" y1="150" x2="990" y2="360" stroke="#a78bfa" stroke-width="1"/>
  </g>
  <!-- mini pyramid -->
  <g transform="translate(1000 120)">
    <rect x="0" y="120" width="44" height="30" rx="5" fill="#1e3a8a" stroke="#3b82f6"/>
    <rect x="50" y="120" width="44" height="30" rx="5" fill="#1e3a8a" stroke="#3b82f6"/>
    <rect x="100" y="120" width="44" height="30" rx="5" fill="url(#ink)"/>
    <rect x="150" y="120" width="44" height="30" rx="5" fill="#1e3a8a" stroke="#3b82f6"/>
    <rect x="200" y="120" width="44" height="30" rx="5" fill="#1e3a8a" stroke="#3b82f6"/>
    <rect x="50" y="84" width="44" height="30" rx="5" fill="#312e81" stroke="#6366f1"/>
    <rect x="100" y="84" width="44" height="30" rx="5" fill="url(#ink)"/>
    <rect x="150" y="84" width="44" height="30" rx="5" fill="#312e81" stroke="#6366f1"/>
    <rect x="100" y="48" width="44" height="30" rx="5" fill="url(#ink)"/>
  </g>
  <text x="72" y="150" fill="url(#ink)" font-size="72" font-weight="800" letter-spacing="-1.5">onRails</text>
  <text x="74" y="208" fill="#e5e7eb" font-size="30" font-weight="600">Put your AI on rails. Pitch. Grill. Slice. Ship.</text>
  <text x="74" y="256" fill="#9ca3af" font-size="20">Rules, skills and a build loop for Claude Code and Codex. From a pitch to a deployed app.</text>
  <text x="74" y="306" fill="#6b7280" font-size="16">by jay · jsmigen.dev</text>
</svg>
