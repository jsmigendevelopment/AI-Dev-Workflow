<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 668" width="960" height="668" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>How it works: you plan once, then a build loop builds, checks, merges and tests one issue at a time, and your feedback becomes new issues</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#17133a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#818cf8"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-you" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c4b5fd"/>
    </marker>
  </defs>
  <rect width="960" height="668" rx="20" fill="url(#bg)"/>
  <rect width="960" height="668" rx="20" fill="url(#glow)"/>
  <text x="40" y="52" fill="#e5e7eb" font-size="22" font-weight="700">How it works</text>
  <text x="40" y="78" fill="#9ca3af" font-size="14">You plan once. Then agents build one issue at a time, and every change is checked before it merges.</text>

  <!-- plan -->
  <rect x="24" y="98" width="896" height="110" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#26305a"/>
  <text x="40" y="121" font-size="13"><tspan fill="#93c5fd" font-size="11.5" font-weight="700" letter-spacing="1.2">PLAN</tspan><tspan fill="#9ca3af" dx="10">once per project · the agent asks, you decide</tspan></text>
  <rect x="40" y="132" width="112" height="62" rx="10" fill="#111735" stroke="#3b82f6" stroke-width="1.25"/>
  <text x="96" y="159" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Pitch</text>
  <text x="96" y="178" fill="#9ca3af" font-size="12" text-anchor="middle">in your words</text>
  <path d="M155 163 H162.33333333333331" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="165.33333333333331" y="132" width="112" height="62" rx="10" fill="#111735" stroke="#4f79f4" stroke-width="1.25"/>
  <text x="221.33333333333331" y="159" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Product grill</text>
  <text x="221.33333333333331" y="178" fill="#9ca3af" font-size="12" text-anchor="middle">asks 3 at a time</text>
  <path d="M280.3333333333333 163 H287.66666666666663" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290.66666666666663" y="132" width="112" height="62" rx="10" fill="#111735" stroke="#6366f1" stroke-width="1.25"/>
  <text x="346.66666666666663" y="159" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">MVP</text>
  <text x="346.66666666666663" y="178" fill="#9ca3af" font-size="12" text-anchor="middle">one core thing</text>
  <path d="M405.66666666666663 163 H412.99999999999994" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="416" y="132" width="112" height="62" rx="10" fill="#111735" stroke="#7377f5" stroke-width="1.25"/>
  <text x="472" y="159" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Name + repo</text>
  <text x="472" y="178" fill="#9ca3af" font-size="12" text-anchor="middle">git init, GitHub</text>
  <path d="M531 163 H538.3333333333334" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="541.3333333333333" y="132" width="112" height="62" rx="10" fill="#111735" stroke="#818cf8" stroke-width="1.25"/>
  <text x="597.3333333333333" y="159" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Tech grill</text>
  <text x="597.3333333333333" y="178" fill="#9ca3af" font-size="12" text-anchor="middle">accept or swap</text>
  <path d="M656.3333333333333 163 H663.6666666666666" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="666.6666666666666" y="132" width="112" height="62" rx="10" fill="#111735" stroke="#948bf9" stroke-width="1.25"/>
  <text x="722.6666666666666" y="159" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">CTO plan</text>
  <text x="722.6666666666666" y="178" fill="#9ca3af" font-size="12" text-anchor="middle">slices + design</text>
  <path d="M781.6666666666666 163 H789" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="792" y="132" width="112" height="62" rx="10" fill="#111735" stroke="#a78bfa" stroke-width="1.25"/>
  <text x="848" y="159" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Issues</text>
  <text x="848" y="178" fill="#9ca3af" font-size="12" text-anchor="middle">one per slice</text>

  <!-- ready issues go to the loop -->
  <path d="M848 194 V216 Q848 226 838 226 H144.5 Q134.5 226 134.5 236 V277" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="412" y="215" width="170" height="22" rx="11" fill="#0d1230" stroke="#26305a"/>
  <text x="497" y="230.3" fill="#cbd5e1" font-size="12.5" text-anchor="middle">ready issues, slice 0 first</text>

  <!-- build loop -->
  <rect x="24" y="244" width="896" height="260" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#26305a"/>
  <text x="154.5" y="267" font-size="13"><tspan fill="#c4b5fd" font-size="11.5" font-weight="700" letter-spacing="1.2">BUILD LOOP</tspan><tspan fill="#9ca3af" dx="10">runs by itself · tells you when it needs you</tspan></text>
  <rect x="40" y="280" width="189" height="68" rx="12" fill="#111735" stroke="#3b82f6" stroke-width="1.25"/>
  <text x="56" y="310" fill="#ffffff" font-size="15" font-weight="700">Coordinate</text>
  <text x="56" y="330" fill="#9ca3af" font-size="12.5">picks a ready issue</text>
  <rect x="265" y="280" width="189" height="68" rx="12" fill="#111735" stroke="#4f79f4" stroke-width="1.25"/>
  <text x="281" y="310" fill="#ffffff" font-size="15" font-weight="700">Build</text>
  <text x="281" y="330" fill="#9ca3af" font-size="12.5">one fresh agent per issue</text>
  <rect x="490" y="280" width="189" height="68" rx="12" fill="#111735" stroke="#6366f1" stroke-width="1.25"/>
  <text x="506" y="310" fill="#ffffff" font-size="15" font-weight="700">CI + code review</text>
  <text x="506" y="330" fill="#9ca3af" font-size="12.5">every pull request</text>
  <rect x="715" y="280" width="189" height="68" rx="12" fill="#111735" stroke="#7377f5" stroke-width="1.25"/>
  <text x="731" y="310" fill="#ffffff" font-size="15" font-weight="700">QA on the preview</text>
  <text x="731" y="330" fill="#9ca3af" font-size="12.5">normal and risky lanes</text>
  <rect x="715" y="418" width="189" height="68" rx="12" fill="#111735" stroke="#818cf8" stroke-width="1.25"/>
  <text x="731" y="448" fill="#ffffff" font-size="15" font-weight="700">Security review</text>
  <text x="731" y="468" fill="#9ca3af" font-size="12.5">risky lane only</text>
  <rect x="490" y="418" width="189" height="68" rx="12" fill="#111735" stroke="#948bf9" stroke-width="1.25"/>
  <text x="506" y="448" fill="#ffffff" font-size="15" font-weight="700">Merge → deploy</text>
  <text x="506" y="468" fill="#9ca3af" font-size="12.5">checked commit, to test</text>
  <rect x="265" y="418" width="189" height="68" rx="12" fill="#111735" stroke="#a78bfa" stroke-width="1.25"/>
  <text x="281" y="448" fill="#ffffff" font-size="15" font-weight="700">Smoke test</text>
  <text x="281" y="468" fill="#9ca3af" font-size="12.5">main flow, on the test site</text>
  <path d="M232 314 H262" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M457 314 H487" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M682 314 H712" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M809.5 351 V415" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M712 452 H682" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M487 452 H457" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M262 452 H146.5 Q134.5 452 134.5 440 V351" fill="none" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="148.5" y="443" fill="#cbd5e1" font-size="12.5">next issue</text>

  <!-- a failed check goes back to Build -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.25" stroke-dasharray="4 4">
    <path d="M755 350 V416"/>
    <path d="M584.5 350 V383"/>
    <path d="M755 383 H369.5 Q359.5 383 359.5 373 V351" marker-end="url(#arrow-soft)"/>
  </g>
  <text x="373.5" y="375" fill="#cbd5e1" font-size="12.5">a failed check goes back to Build</text>

  <!-- you -->
  <path d="M359.5 489 V539" fill="none" stroke="#c4b5fd" stroke-width="1.5" marker-end="url(#arrow-you)"/>
  <rect x="265" y="542" width="189" height="68" rx="12" fill="url(#ink)"/>
  <text x="281" y="572" fill="#0a0f24" font-size="15.5" font-weight="800">You try it</text>
  <text x="281" y="592" fill="#111735" font-size="12.5" font-weight="600">on the test site</text>
  <path d="M457 576 H928 Q938 576 938 566 V173 Q938 163 928 163 H907" fill="none" stroke="#c4b5fd" stroke-width="1.5" marker-end="url(#arrow-you)"/>
  <text x="472" y="567" fill="#e5e7eb" font-size="13">Your feedback becomes new issues</text>

  <text x="40" y="642" font-size="12.5" fill="#9ca3af"><tspan fill="#cbd5e1" font-weight="700">Lanes</tspan><tspan dx="10">tiny: CI + review</tspan><tspan dx="10">·</tspan><tspan dx="10">normal: + QA on the preview</tspan><tspan dx="10">·</tspan><tspan dx="10">risky: + security review, then you approve</tspan></text>
</svg>
