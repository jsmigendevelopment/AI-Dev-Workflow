<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>The tracer-bullet pyramid</title>
  <defs>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a33"/>
    </linearGradient>
  </defs>
  <rect width="860" height="400" rx="20" fill="url(#bg)"/>
  <text x="40" y="50" fill="#e5e7eb" font-size="22" font-weight="700">The tracer-bullet pyramid</text>
  <text x="40" y="76" fill="#9ca3af" font-size="14">Every slice cuts through schema → API → UI. Each pass up is narrower and deeper.</text>

  <!-- pass 1: every slice -->
  <g>
    <rect x="40"  y="270" width="96" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <rect x="146" y="270" width="96" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <rect x="252" y="270" width="96" height="60" rx="8" fill="url(#core)"/>
    <rect x="358" y="270" width="96" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <rect x="464" y="270" width="96" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
  </g>
  <!-- pass 2 -->
  <g>
    <rect x="146" y="200" width="96" height="60" rx="8" fill="#312e81" stroke="#6366f1"/>
    <rect x="252" y="200" width="96" height="60" rx="8" fill="url(#core)"/>
    <rect x="358" y="200" width="96" height="60" rx="8" fill="#312e81" stroke="#6366f1"/>
  </g>
  <!-- pass 3 -->
  <rect x="252" y="130" width="96" height="60" rx="8" fill="url(#core)"/>
  <text x="300" y="166" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">★</text>

  <!-- slice labels -->
  <g fill="#9ca3af" font-size="13" text-anchor="middle">
    <text x="88"  y="354">support</text>
    <text x="194" y="354">support</text>
    <text x="300" y="354" fill="#c4b5fd" font-weight="700">CORE</text>
    <text x="406" y="354">support</text>
    <text x="512" y="354">support</text>
  </g>

  <!-- pass labels -->
  <g font-size="14">
    <text x="590" y="166" fill="#c4b5fd" font-weight="700">Pass 3</text>
    <text x="650" y="166" fill="#9ca3af">core only · hardest · polished</text>
    <text x="590" y="236" fill="#a5b4fc" font-weight="700">Pass 2</text>
    <text x="650" y="236" fill="#9ca3af">core + key supports · deeper</text>
    <text x="590" y="306" fill="#93c5fd" font-weight="700">Pass 1</text>
    <text x="650" y="306" fill="#9ca3af">every slice · thin · end to end</text>
  </g>
  <g stroke="#374151" stroke-dasharray="3 4">
    <line x1="568" y1="160" x2="584" y2="160"/>
    <line x1="568" y1="230" x2="584" y2="230"/>
    <line x1="568" y1="300" x2="584" y2="300"/>
  </g>
  <text x="40" y="384" fill="#6b7280" font-size="12">The core gets the most passes and the strongest models. Supporting slices stop once they serve the core.</text>
</svg>
