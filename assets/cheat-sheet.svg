<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 396" width="1280" height="396" font-family="Inter, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Cheat sheet: four commands</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#17133a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="396" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="396" rx="24" fill="url(#glow)"/>
  <text x="64" y="92" fill="url(#ink)" font-size="52" font-weight="800" letter-spacing="-1">Cheat sheet</text>
  <text x="66" y="134" fill="#9ca3af" font-size="20">Four commands. Type them in Claude Code with / or in Codex with $.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(64 176)">
      <rect width="266" height="168" rx="16" fill="#111735" stroke="#3b82f6"/>
      <text x="24" y="62" fill="#ffffff" font-size="40" font-weight="700">/idea</text>
    </g>
    <g transform="translate(350 176)">
      <rect width="266" height="168" rx="16" fill="#111735" stroke="#6366f1"/>
      <text x="24" y="62" fill="#ffffff" font-size="40" font-weight="700">/join</text>
    </g>
    <g transform="translate(636 176)">
      <rect width="266" height="168" rx="16" fill="#111735" stroke="#818cf8"/>
      <text x="24" y="62" fill="#ffffff" font-size="40" font-weight="700">/back</text>
    </g>
    <g transform="translate(922 176)">
      <rect width="294" height="168" rx="16" fill="#111735" stroke="#a78bfa"/>
      <text x="24" y="62" fill="#ffffff" font-size="40" font-weight="700">/afk</text>
    </g>
  </g>
  <g fill="#cbd5e1" font-size="18">
    <text x="88" y="296">I have an idea</text>
    <text x="88" y="324" fill="#6b7280" font-size="15">idea → planned repo</text>
    <text x="374" y="296">I'm new to this repo</text>
    <text x="374" y="324" fill="#6b7280" font-size="15">repo → understood</text>
    <text x="660" y="296">I'm starting or back</text>
    <text x="660" y="324" fill="#6b7280" font-size="15">what changed, what's next</text>
    <text x="946" y="296">I'm stepping away</text>
    <text x="946" y="324" fill="#6b7280" font-size="15">the loop keeps building</text>
  </g>
</svg>
