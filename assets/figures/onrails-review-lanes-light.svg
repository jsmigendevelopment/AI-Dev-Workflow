<svg xmlns="http://www.w3.org/2000/svg" id="or-review-lanes" width="360" height="933" viewBox="0 0 360 933" role="img" aria-labelledby="or-review-lanes-title" aria-describedby="or-review-lanes-desc">
  <title id="or-review-lanes-title">onRails review lanes</title>
  <desc id="or-review-lanes-desc">Every lane starts with local checks and fresh code review. Normal adds a preview test. Risky also adds a security reviewer. A failed sign-in check sends a fix through local checks again. An always-stop action needs the owner in every lane.</desc>
  <style>
    #or-review-lanes{--or-bg:#fff8ef;--or-end:#fff1d7;--or-card:#fffcfa;--or-gold:#ffe9bd;--or-violet:#f2eaff;--or-ink:#211637;--or-note:#55426a;--or-line:#6242a2;--or-amber:#8a4319;--or-glow:#ffd166;color:var(--or-ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #or-review-lanes text{fill:currentColor}
    #or-review-lanes .heading{font-size:23px;font-weight:800;letter-spacing:-.55px}
    #or-review-lanes .node-label{font-size:16px;font-weight:680}
    #or-review-lanes .label{font-size:14px;font-weight:580;fill:var(--or-note)}
    #or-review-lanes .warm{font-size:14px;font-weight:700;fill:var(--or-amber)}
    #or-review-lanes .sheet{fill:url(#or-review-lanes-paper)}
    #or-review-lanes .halo{fill:var(--or-glow);opacity:.44;fill-rule:evenodd}
    #or-review-lanes .rule{fill:none;stroke:var(--or-amber);stroke-width:2;stroke-linecap:round}
    #or-review-lanes .node{fill:var(--or-card);stroke:var(--or-line);stroke-width:1.5}
    #or-review-lanes .gold{fill:var(--or-gold);stroke:var(--or-amber)}
    #or-review-lanes .violet{fill:var(--or-violet)}
    #or-review-lanes .rail{fill:none;stroke:var(--or-line);stroke-width:1.7;stroke-linejoin:round;marker-end:url(#or-review-lanes-arrow)}
    #or-review-lanes .retry{stroke:var(--or-amber);stroke-dasharray:5 4;marker-end:url(#or-review-lanes-return)}
    #or-review-lanes .stop-rail{stroke:var(--or-amber);marker-end:url(#or-review-lanes-return)}
    #or-review-lanes .arrow{fill:var(--or-line)}
    #or-review-lanes .return{fill:var(--or-amber)}
  </style>
  <defs>
    <linearGradient id="or-review-lanes-paper" x2="1" y2="1"><stop stop-color="var(--or-bg)"/><stop offset="1" stop-color="var(--or-end)"/></linearGradient>
    <marker id="or-review-lanes-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="arrow" d="M0 0l8 4-8 4z"/></marker>
    <marker id="or-review-lanes-return" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="return" d="M0 0l8 4-8 4z"/></marker>
  </defs>
  <rect class="sheet" width="360" height="933" rx="22"/>
<path class="halo" d="M336 71a16 16 0 1 1-32 0 16 16 0 0 1 32 0zm-4 0a12 12 0 1 1-24 0 12 12 0 0 1 24 0z"/>
<path class="rule" d="M24 64h42m6 0h13"/>
<text class="heading" x="23" y="48" text-anchor="start">onRails review lanes</text>
<path class="rail stop-rail" d="M161 121h52"/>
<path class="rail" d="M137 223v28"/>
<path class="rail" d="M137 295v56"/>
<path class="rail" d="M228 373h92v431h-90"/>
<path class="rail" d="M137 395v56"/>
<path class="rail" d="M228 473h50v314h-48"/>
<path class="rail" d="M137 495v70"/>
<path class="rail" d="M198 609v153"/>
<path class="rail" d="M96 609v54"/>
<path class="rail" d="M137 834v34"/>
<path class="rail retry" d="M38 685H23V273h23"/>
<text class="warm" x="190" y="90" text-anchor="middle">At any
<tspan x="190" dy="17">step</tspan></text>
<text class="label" x="151" y="330" text-anchor="start">Pass</text>
<text class="label" x="274" y="359" text-anchor="middle">Tiny change</text>
<text class="label" x="151" y="427" text-anchor="start">Normal or risky</text>
<text class="label" x="272" y="453" text-anchor="middle">Normal
<tspan x="272" dy="17">change</tspan></text>
<text class="label" x="151" y="522" text-anchor="start">Risky change</text>
<text class="warm" x="151" y="544" text-anchor="start">Sign-in change</text>
<text class="label" x="210" y="714" text-anchor="start">Pass</text>
<text class="warm" x="105" y="631" text-anchor="start">Access
<tspan x="105" dy="17">check fails</tspan></text>
<text class="warm" x="34" y="536" text-anchor="start">New commit</text>
<text class="label" x="151" y="852" text-anchor="start">Checked commit</text>
<rect class="node gold" x="22" y="88" width="139" height="56" rx="9"/>
<text class="node-label" x="91.5" y="112.5" text-anchor="middle">Always-stop
<tspan x="91.5" dy="17">action</tspan></text>
<path class="node gold" d="M222 88H329l9 9v38l-9 9H222l-9-9V97z"/>
<text class="node-label" x="275.5" y="121" text-anchor="middle">Ask the owner</text>
<rect class="node gold" x="46" y="179" width="182" height="44" rx="9"/>
<text class="node-label" x="137" y="206" text-anchor="middle">Proposed change</text>
<rect class="node" x="46" y="251" width="182" height="44" rx="9"/>
<text class="node-label" x="137" y="278" text-anchor="middle">Local checks</text>
<rect class="node violet" x="46" y="351" width="182" height="44" rx="9"/>
<text class="node-label" x="137" y="378" text-anchor="middle">Fresh code review</text>
<rect class="node" x="46" y="451" width="182" height="44" rx="9"/>
<text class="node-label" x="137" y="478" text-anchor="middle">Test the preview</text>
<rect class="node violet" x="46" y="565" width="182" height="44" rx="9"/>
<text class="node-label" x="137" y="592" text-anchor="middle">Fresh security review</text>
<rect class="node gold" x="38" y="663" width="128" height="44" rx="9"/>
<text class="node-label" x="102" y="690" text-anchor="middle">Fix the change</text>
<rect class="node violet" x="44" y="762" width="186" height="72" rx="9"/>
<text class="node-label" x="137" y="786" text-anchor="middle">Merge gate</text>
<text class="label" x="137" y="806" text-anchor="middle">Owner approval<tspan x="137" dy="17">if required</tspan></text>
<rect class="node gold" x="46" y="868" width="182" height="44" rx="9"/>
<text class="node-label" x="137" y="895" text-anchor="middle">Test site</text>
</svg>
