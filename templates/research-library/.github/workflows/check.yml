name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the append-only check needs the merge base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails the moment the library is made public.
      - run: node scripts/research-library.mjs private "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/check-library.mjs --base origin/main
