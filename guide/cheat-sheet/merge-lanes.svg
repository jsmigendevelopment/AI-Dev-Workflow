<svg xmlns="http://www.w3.org/2000/svg" width="352" height="478" viewBox="0 0 352 478" role="img" aria-labelledby="title desc">
  <title id="title">Merge lanes</title>
  <desc id="desc">Tiny. Copy, styling or config. Run CI and code review. Normal. Add QA on the preview. Risky. Add security review for auth, secrets, personal data, money, migrations or new dependencies. Ask the owner unless Full automation allows the merge. Failed check. Return to a fresh builder. Park the issue after two rejected rounds.</desc>
  <style>
  svg{--ink:#0f1020;--muted:#55566b;--paper:#ffffff;--panel:#f7f7fb;--line:#e4e4ee;--a:#7c3aed;--b:#2563eb}
  @media(prefers-color-scheme:dark){svg{--ink:#f2f2f7;--muted:#a3a4b8;--paper:#12121c;--panel:#0a0a12;--line:#262636;--a:#a78bfa;--b:#60a5fa}}
  text{font-family:system-ui,sans-serif;fill:var(--ink)}
  .body{font-size:16px;fill:var(--muted)}
  .key{font-family:ui-monospace,monospace;font-size:16px;font-weight:650;fill:var(--a)}
  .label{font-size:17px;font-weight:650}
</style>
  <defs><linearGradient id="rails"><stop style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--b)"/></linearGradient></defs>
  <rect x="1" y="1" width="350" height="476" rx="18" fill="var(--paper)" stroke="var(--line)"/>
  <g fill="none" stroke="url(#rails)" stroke-width="2.5"><path d="M-4 24h360"/><path d="M-4 40h121c25 0 23-16 48-16"/><path d="M204 24c22 0 23 16 47 16h105"/></g>
  <g fill="var(--paper)" stroke="var(--a)" stroke-width="3"><circle cx="47" cy="24" r="5"/><circle cx="269" cy="24" r="5"/></g><text x="21" y="72" font-size="24" font-weight="700" letter-spacing="-.7">Merge lanes</text><path d="M23 97V385" stroke="var(--line)" stroke-width="3"/><circle cx="23" cy="97" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="179" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="240" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="385" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><text x="45" y="102" class="label">Tiny</text>
  <text x="45" y="124" class="body">Copy, styling or config. Run CI</text>
  <text x="45" y="145" class="body">and code review.</text>
  <text x="45" y="184" class="label">Normal</text>
  <text x="45" y="206" class="body">Add QA on the preview.</text>
  <text x="45" y="245" class="label">Risky</text>
  <text x="45" y="267" class="body">Add security review for auth,</text>
  <text x="45" y="288" class="body">secrets, personal data, money,</text>
  <text x="45" y="309" class="body">migrations or new dependencies.</text>
  <text x="45" y="330" class="body">Ask the owner unless Full</text>
  <text x="45" y="351" class="body">automation allows the merge.</text>
  <text x="45" y="390" class="label">Failed check</text>
  <text x="45" y="412" class="body">Return to a fresh builder. Park</text>
  <text x="45" y="433" class="body">the issue after two rejected</text>
  <text x="45" y="454" class="body">rounds.</text>
</svg>
