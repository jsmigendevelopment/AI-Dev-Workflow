<svg xmlns="http://www.w3.org/2000/svg" width="352" height="437" viewBox="0 0 352 437" role="img" aria-labelledby="title desc">
  <title id="title">Check and steer</title>
  <desc id="desc">/pr-security N · $pr-security N. Review risky changes in pull request N. /qa · $qa. Try the change in a real browser on the preview. /ask · $ask. Bring a decision or blocker to the owner. /automation · $automation. Set how much agents can do on their own.</desc>
  <style>
  svg{--ink:#0f1020;--muted:#55566b;--paper:#ffffff;--panel:#f7f7fb;--line:#e4e4ee;--a:#7c3aed;--b:#2563eb}
  @media(prefers-color-scheme:dark){svg{--ink:#f2f2f7;--muted:#a3a4b8;--paper:#12121c;--panel:#0a0a12;--line:#262636;--a:#a78bfa;--b:#60a5fa}}
  text{font-family:system-ui,sans-serif;fill:var(--ink)}
  .body{font-size:16px;fill:var(--muted)}
  .key{font-family:ui-monospace,monospace;font-size:16px;font-weight:650;fill:var(--a)}
  .label{font-size:17px;font-weight:650}
</style>
  <defs><linearGradient id="rails"><stop style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--b)"/></linearGradient></defs>
  <rect x="1" y="1" width="350" height="435" rx="18" fill="var(--paper)" stroke="var(--line)"/>
  <g fill="none" stroke="url(#rails)" stroke-width="2.5"><path d="M-4 33h360"/><path d="M82 33h22c37 0 32-17 64-17h64"/><path d="M187 33h24c23 0 24 12 48 12h97"/></g>
  <g fill="var(--paper)" stroke="var(--a)" stroke-width="3"><circle cx="47" cy="33" r="5"/><circle cx="269" cy="33" r="5"/></g><text x="21" y="72" font-size="24" font-weight="700" letter-spacing="-.7">Check and steer</text><path d="M23 97V365" stroke="var(--line)" stroke-width="3"/><circle cx="23" cy="97" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="201" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="283" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="365" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><text x="45" y="102" class="key">/pr-security N</text>
  <text x="45" y="124" class="key">$pr-security N</text>
  <text x="45" y="146" class="body">Review risky changes in pull</text>
  <text x="45" y="167" class="body">request N.</text>
  <text x="45" y="206" class="key">/qa · $qa</text>
  <text x="45" y="228" class="body">Try the change in a real browser</text>
  <text x="45" y="249" class="body">on the preview.</text>
  <text x="45" y="288" class="key">/ask · $ask</text>
  <text x="45" y="310" class="body">Bring a decision or blocker to the</text>
  <text x="45" y="331" class="body">owner.</text>
  <text x="45" y="370" class="key">/automation · $automation</text>
  <text x="45" y="392" class="body">Set how much agents can do on</text>
  <text x="45" y="413" class="body">their own.</text>
</svg>
