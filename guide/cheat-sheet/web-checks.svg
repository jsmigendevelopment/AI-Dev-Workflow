<svg xmlns="http://www.w3.org/2000/svg" width="352" height="437" viewBox="0 0 352 437" role="img" aria-labelledby="title desc">
  <title id="title">Web checks</title>
  <desc id="desc">/web-performance · $web-performance. Check load time, layout shifts and bundle size. /web-security · $web-security. Check request limits and browser protections. /seo · $seo. Check metadata, indexing and share previews. /a11y · $a11y. Check keyboard access, contrast and reflow.</desc>
  <style>
  svg{--ink:#0f1020;--muted:#55566b;--paper:#ffffff;--panel:#f7f7fb;--line:#e4e4ee;--a:#7c3aed;--b:#2563eb}
  @media(prefers-color-scheme:dark){svg{--ink:#f2f2f7;--muted:#a3a4b8;--paper:#12121c;--panel:#0a0a12;--line:#262636;--a:#a78bfa;--b:#60a5fa}}
  text{font-family:system-ui,sans-serif;fill:var(--ink)}
  .body{font-size:16px;fill:var(--muted)}
  .key{font-family:ui-monospace,monospace;font-size:16px;font-weight:650;fill:var(--a)}
  .label{font-size:17px;font-weight:650}
</style>
  <defs><linearGradient id="rails"><stop style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--b)"/></linearGradient></defs>
  <rect x="1" y="1" width="350" height="435" rx="18" fill="var(--paper)" stroke="var(--line)"/>
  <g fill="none" stroke="url(#rails)" stroke-width="2.5"><path d="M-4 33h360"/><path d="M82 33h22c37 0 32-17 64-17h64"/><path d="M187 33h24c23 0 24 12 48 12h97"/></g>
  <g fill="var(--paper)" stroke="var(--a)" stroke-width="3"><circle cx="47" cy="33" r="5"/><circle cx="269" cy="33" r="5"/></g><text x="21" y="72" font-size="24" font-weight="700" letter-spacing="-.7">Web checks</text><path d="M23 97V365" stroke="var(--line)" stroke-width="3"/><circle cx="23" cy="97" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="201" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="283" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="365" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><text x="45" y="102" class="key">/web-performance</text>
  <text x="45" y="124" class="key">$web-performance</text>
  <text x="45" y="146" class="body">Check load time, layout shifts and</text>
  <text x="45" y="167" class="body">bundle size.</text>
  <text x="45" y="206" class="key">/web-security · $web-security</text>
  <text x="45" y="228" class="body">Check request limits and browser</text>
  <text x="45" y="249" class="body">protections.</text>
  <text x="45" y="288" class="key">/seo · $seo</text>
  <text x="45" y="310" class="body">Check metadata, indexing and</text>
  <text x="45" y="331" class="body">share previews.</text>
  <text x="45" y="370" class="key">/a11y · $a11y</text>
  <text x="45" y="392" class="body">Check keyboard access, contrast</text>
  <text x="45" y="413" class="body">and reflow.</text>
</svg>
