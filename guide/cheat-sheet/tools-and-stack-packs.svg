<svg xmlns="http://www.w3.org/2000/svg" width="352" height="481" viewBox="0 0 352 481" role="img" aria-labelledby="title desc">
  <title id="title">Tools and stack packs</title>
  <desc id="desc">/dependencies · $dependencies. Verify packages before adding them. /writing-for-agents · $writing-for-agents. Write instructions an agent can follow. /stack-tanstack-start · $stack-tanstack-start. Use the web app pack on Cloudflare. /stack-monorepo-expo · $stack-monorepo-expo. Use the shared web and mobile pack.</desc>
  <style>
