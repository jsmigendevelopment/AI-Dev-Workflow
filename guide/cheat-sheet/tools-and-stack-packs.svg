  <text x="45" y="206" class="key">$writing-for-agents</text>
  <text x="45" y="228" class="body">Write instructions an agent can</text>
  <text x="45" y="249" class="body">follow.</text>
  <text x="45" y="288" class="key">/stack-tanstack-start</text>
  <text x="45" y="310" class="key">$stack-tanstack-start</text>
  <text x="45" y="332" class="body">Use the web app pack on</text>
  <text x="45" y="353" class="body">Cloudflare.</text>
  <text x="45" y="392" class="key">/stack-monorepo-expo</text>
  <text x="45" y="414" class="key">$stack-monorepo-expo</text>
