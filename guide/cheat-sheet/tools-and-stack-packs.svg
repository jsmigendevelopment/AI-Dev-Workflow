  text{font-family:system-ui,sans-serif;fill:var(--ink)}
  .body{font-size:16px;fill:var(--muted)}
  .key{font-family:ui-monospace,monospace;font-size:16px;font-weight:650;fill:var(--a)}
  .label{font-size:17px;font-weight:650}
</style>
  <defs><linearGradient id="rails"><stop style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--b)"/></linearGradient></defs>
  <rect x="1" y="1" width="350" height="479" rx="18" fill="var(--paper)" stroke="var(--line)"/>
  <g fill="none" stroke="url(#rails)" stroke-width="2.5"><path d="M-4 33h360"/><path d="M82 33h22c37 0 32-17 64-17h64"/><path d="M187 33h24c23 0 24 12 48 12h97"/></g>
  <g fill="var(--paper)" stroke="var(--a)" stroke-width="3"><circle cx="47" cy="33" r="5"/><circle cx="269" cy="33" r="5"/></g><text x="21" y="72" font-size="24" font-weight="700" letter-spacing="-.7">Tools and stack packs</text><path d="M23 97V387" stroke="var(--line)" stroke-width="3"/><circle cx="23" cy="97" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="179" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="283" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="387" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><text x="45" y="102" class="key">/dependencies · $dependencies</text>
  <text x="45" y="124" class="body">Verify packages before adding</text>
  <text x="45" y="145" class="body">them.</text>
