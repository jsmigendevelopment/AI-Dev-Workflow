  <g fill="var(--paper)" stroke="var(--a)" stroke-width="3"><circle cx="47" cy="24" r="5"/><circle cx="269" cy="24" r="5"/></g><text x="21" y="72" font-size="24" font-weight="700" letter-spacing="-.7">Needs you</text><path d="M23 97V551" stroke="var(--line)" stroke-width="3"/><circle cx="23" cy="97" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="179" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="303" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="406" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><circle cx="23" cy="551" r="4.5" fill="var(--paper)" stroke="var(--a)" stroke-width="2.5"/><text x="45" y="102" class="label">Blocker</text>
  <text x="45" y="124" class="body">Ping now. Other safe work</text>
  <text x="45" y="145" class="body">continues.</text>
  <text x="45" y="184" class="label">Decision</text>
  <text x="45" y="206" class="body">Batch questions about gates,</text>
  <text x="45" y="227" class="body">scope, taste or money. By</text>
  <text x="45" y="248" class="body">default, at most one ping every 30</text>
  <text x="45" y="269" class="body">minutes.</text>
  <text x="45" y="308" class="label">FYI</text>
  <text x="45" y="330" class="body">Record progress, usage and rate</text>
  <text x="45" y="351" class="body">limits on the board. Catch up with</text>
  <text x="45" y="372" class="body">/back.</text>
