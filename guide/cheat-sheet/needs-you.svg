<svg xmlns="http://www.w3.org/2000/svg" width="352" height="623" viewBox="0 0 352 623" role="img" aria-labelledby="title desc">
  <title id="title">Needs you</title>
  <desc id="desc">Blocker. Ping now. Other safe work continues. Decision. Batch questions about gates, scope, taste or money. By default, at most one ping every 30 minutes. FYI. Record progress, usage and rate limits on the board. Catch up with /back. Board. Open ~/.onrails/boards/&lt;project&gt;.md or the configured Google Sheet. Quiet hours and the batch window live in the profile. While away. Only production going down or a live security hole interrupts you.</desc>
  <style>
  svg{--ink:#0f1020;--muted:#55566b;--paper:#ffffff;--panel:#f7f7fb;--line:#e4e4ee;--a:#7c3aed;--b:#2563eb}
